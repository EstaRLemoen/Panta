======

## Repair Goal
Make the test's assertions, expected exceptions, and other behavioral checks honestly reflect the runtime facts already observed during execution.

When fixing runtime failures:
- If the failure message shows an actual value, update the assertion to match that value.
- If the failure message shows the actual exception type, update the expected exception to match it.
- If the failure message shows an actual count, size, or number of records, update the assertion to match it.
- Do not produce a repaired test that still contradicts the actual result shown in the failure message.
- Do not weaken the test into a trivial smoke check just to make it pass.

Examples:

Assertion failure example:

Failing test:
```java
@Test
public void testFormatName() {
    assertEquals("ALICE", formatter.formatName("alice"));
}
```

If the real execution result is `"Alice"`, repair the test to assert `"Alice"`.

Expected-exception example when an exception is actually thrown:

Failing test:
```java
@Test(expected = IllegalArgumentException.class)
public void testParseInvalidInput() {
    parser.parse(null);
}
```

If the real execution throws `NullPointerException`, repair the test to expect `NullPointerException` instead.

Expected-exception example when no exception is thrown:

Failing test:
```java
@Test(expected = IllegalArgumentException.class)
public void testParseEmptyInput() {
    parser.parse("");
}
```

If the real execution does not throw an exception and instead returns an empty result, remove the incorrect exception expectation and assert the empty result.

## Response
The output must be a YAML object equivalent to type `NewTests`, according to the following definitions:
=====
class SingleTest {
    String test_behavior; // Short description of the behavior the fixed test covers
    String test_name; // A short test name, in camel case, that reflects the repaired behavior
    String test_code; // A single fixed test function, written as if it belongs in the existing test suite
    String new_imports_code; // New imports required by the fixed test and not already present in the test file
}

class NewTests {
    String language; // The programming language of the source code
    String existing_test_function_signature; // A single line repeating a signature header of one of the existing test functions
    List<SingleTest> new_tests; // The list contains the fixed test cases
}
=====

Response:
```yaml
