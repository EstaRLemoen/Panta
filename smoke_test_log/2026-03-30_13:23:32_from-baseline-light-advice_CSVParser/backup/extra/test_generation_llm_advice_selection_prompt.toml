## Task
Return one YAML object with this schema:

```yaml
test_designs:
  - design_name: |
      A short name for this test idea.
    method_context:
      method_signature_hint: |
        Short method signature or declaration fragment that identifies the method containing the uncovered target branch. This may be a private or internal method if that is where the branch lives.
      entry_hint: |
        The public or externally reachable entry method that a real test should use to reach this target region. Give a method signature or method-identifying fragment with parameter types or other details needed to disambiguate overloads. Do not provide a full invocation expression, literal test data, or private/internal helper calls here.
    execution_flow: |
      How execution should flow from the chosen public or externally reachable entry method to the uncovered target.
      It Should consist of actual code statements instead of giving a one-line summary.
    input_focus: |
      A concise description of the input condition, state setup, or external condition needed to drive that execution flow.
    observable_behavior: |
      The externally observable result that the generated test should assert after driving this path.
```

Rules:
1. Do not generate test code.
2. `execution_flow` must be a numbered list of concrete steps that describe the exact runtime path from the public or externally reachable entry method to the uncovered branch. The first step must start from the entry identified by `entry_hint`. Each step must include:
- The method name and the line number (if available) where execution currently is.
- If a branch is encountered: state the exact condition expression, the actual runtime value of each variable in that condition, and which branch is taken (e.g., "then branch" or "else branch").
- Any intermediate method calls or state changes that affect the condition.
- The path must actually reach the chosen uncovered target branch. Do not describe a path whose own runtime values show that the branch condition stays false when the target is the true branch, or stays true when the target is the false branch.
Example format (use similar level of detail):
