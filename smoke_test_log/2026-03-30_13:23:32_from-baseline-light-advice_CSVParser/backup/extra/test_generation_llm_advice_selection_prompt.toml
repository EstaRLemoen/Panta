```java
public class DiscountCalculator {
  public double calculate(double amount, Customer customer) {
      double discount = 0.0;
      if (customer.isPremium() && amount > 100) {
          discount = amount * 0.2;   // uncovered branch
      }
      return amount - discount;
  }
}
```
`execution_flow` part :
``` yaml 
execution_flow: |
  1. Call public entry `DiscountCalculator.calculate(150.0, premiumCustomer)`.
  2. Inside `calculate(double, Customer)` at line 3, evaluate the condition:
      `if (customer.isPremium() && amount > 100)`
  3. Runtime values:
      - `customer.isPremium()` returns `true` (premiumCustomer is a Customer with premium flag set to true).
      - `amount` is `150.0`, so `amount > 100` is `true`.
  4. Because both sides of `&&` are `true`, the overall condition is `true`.
  5. Execution enters the **then branch** (line 4) and executes `discount = amount * 0.2`.
  6. After the branch, returns `150.0 - 30.0 = 120.0`.
```
If the uncovered branch is inside a loop or switch, describe the iteration count or case value that leads to it.
3. DO NOT design tests for parameter validation branches that only check for null (e.g., `Objects.requireNonNull`, `Assertions.notNull`, `if (param == null)`). These are trivial and rarely increase branch coverage.
4. DO NOT design tests for simple getter/setter branches unless they are the only uncovered code.
5. You MUST select an uncovered branch that contains at least one of the following:
   - A logical operator (&&, ||, !)
   - A comparison (<, >, <=, >=, ==, !=) between non-null variables
   - A switch statement with multiple cases
   - A ternary operator
   - A loop condition (while, for) with non-trivial bounds
6. If the source file has no such branch, only then fall back to null checks.
7. If the uncovered branch is inside a private or internal method, keep that method in `method_signature_hint`, but use `entry_hint` and `execution_flow` to describe how a real test reaches it through a public or externally reachable API.
8. Never propose direct calls to private or internal methods, and never propose reflection-based access such as `getDeclaredMethod`, `setAccessible`, or `invoke` as the testing strategy.
9. Prefer designs whose success can be asserted through externally observable behavior such as returned records, exceptions, header maps, line numbers, emitted values, or other public results.
10. Use `entry_hint` only to identify which public entry method the test should start from. Put the concrete argument values, format flags, and state setup needed to make the target branch reachable in `input_focus` instead.
11. If a branch depends on a specific configuration flag or setup condition, name that requirement explicitly in `input_focus`.
12. `observable_behavior` must describe only externally observable behavior such as return values, exceptions, public results, collection contents, collection size, or state visible through public APIs.
13. Do not describe internal implementation steps in `observable_behavior`; those belong in `execution_flow`.
14. Base `observable_behavior` on the source code path you described.


