## Task
Return one YAML object with this schema:

```yaml
test_designs:
  - design_name: |
      A short name for this test idea.
    method_context:
      method_signature_hint: |
        Short method signature or declaration fragment that identifies the method containing the uncovered target branch. This may be a private or internal method if that is where the branch lives.
      entry_hint: |
        The public or externally reachable entry method that a real test should use to reach this target region. Give a method signature or method-identifying fragment with parameter types or other details needed to disambiguate overloads.
    execution_flow: |
      A short numbered list of the key control-flow steps from the public entry method to the uncovered target.
    input_focus: |
      The concrete input condition, state setup, or configuration needed to drive that path.
    observable_behavior: |
      A brief, open-ended description of what to look for when the path is exercised (e.g. "verify the return value, exception behavior, or collection contents according to the source code"). Do NOT predict exact values or precise assertions — let the test generator infer the correct expected behavior from the source code.
```

Example structure (follow this nesting exactly):

```yaml
test_designs:
  - design_name: |
      Test discount applied for premium orders over the threshold.
    method_context:
      method_signature_hint: |
        private int computeDiscountCents(Order order)
      entry_hint: |
        public Receipt checkout(Order order)
    execution_flow: |
      1. Call checkout() with a premium order whose subtotal is above the discount threshold.
      2. During checkout(), computeDiscountCents(...) is reached for that order.
      3. The premium-and-above-threshold branch is taken before the receipt is finalized.
    input_focus: |
      Construct an Order marked as premium with enough line items to exceed the discount threshold.
    observable_behavior: |
      Check that the returned receipt reflects a discounted total and still includes the purchased items.
  - design_name: |
      Test surcharge path for fragile shipment handling.
    method_context:
      method_signature_hint: |
        private ShippingQuote buildQuote(Parcel parcel)
      entry_hint: |
        public Invoice prepareInvoice(Parcel parcel)
    execution_flow: |
      1. Call prepareInvoice() with a parcel flagged as fragile and oversized.
      2. During invoice preparation, buildQuote(...) is reached for shipping cost calculation.
      3. The fragile-handling branch contributes to the final invoice total.
    input_focus: |
      Provide a Parcel that is both fragile and above the oversized threshold.
    observable_behavior: |
      Verify that the produced invoice includes a higher shipping-related charge than the non-fragile baseline.
  - design_name: |
      Test retry path after a transient inventory lookup miss.
    method_context:
      method_signature_hint: |
        private StockRecord fetchStockRecord(String sku)
      entry_hint: |
        public ReservationResult reserve(String sku, int quantity)
    execution_flow: |
      1. Call reserve() for a SKU whose first stock lookup misses but a retry succeeds.
      2. During reservation, fetchStockRecord(...) is reached and the retry path is taken.
      3. The reservation completes after recovering from the transient miss.
    input_focus: |
      Use a SKU and collaborator setup where the first lookup returns no record and the immediate retry returns available stock.
    observable_behavior: |
      Verify that reservation succeeds and reflects the recovered stock availability rather than failing immediately.
  - design_name: |
      Test fallback formatting when the preferred locale pattern is unavailable.
    method_context:
      method_signature_hint: |
        private String resolvePattern(Locale locale)
      entry_hint: |
        public String formatStatement(Locale locale, Money total)
    execution_flow: |
      1. Call formatStatement() with a locale whose preferred pattern is missing.
      2. During formatting, resolvePattern(...) is reached and falls back to the default pattern.
      3. The statement is formatted using the fallback path.
    input_focus: |
      Choose a Locale without a configured custom pattern and provide a representative Money value.
    observable_behavior: |
      Check that formatting still succeeds and that the output follows the fallback style rather than the missing preferred pattern.
```

Rules:
1. Do not generate test code.
2. Prefer returning 4 candidate `test_designs` when the source file offers multiple plausible uncovered behaviors. For larger files, broader APIs, or fragmented uncovered regions, prefer 5 or 6 candidate `test_designs` in a single round. Only return fewer when there are clearly fewer than 4 meaningful uncovered behavior clusters left.
3. Do not let multiple designs collapse onto the same behavior cluster unless the remaining uncovered behavior is genuinely concentrated there. Vary public entry paths, target methods, or observable behaviors when plausible.
4. Keep `execution_flow` lightweight: describe only the key control-flow skeleton needed to understand reachability. Do not write a long step-by-step runtime transcript.
5. `execution_flow` must still start from the public or externally reachable entry identified by `entry_hint` and must reach the target branch.
6. Use `entry_hint` only to identify which public entry method the test should start from. Put the concrete argument values, flags, and state setup in `input_focus`.
7. If the uncovered branch is inside a private or internal method, keep that method in `method_signature_hint`, but describe a public or externally reachable path in `entry_hint` and `execution_flow`.
8. Never propose direct calls to private or internal methods, and never propose reflection-based access.
9. Prefer non-trivial behaviors over null-argument validation unless those are the only uncovered behaviors left.
10. `observable_behavior` should be open-ended and qualitative (e.g. "check the return value structure", "verify exception type", "check collection size or contents"). Do NOT predict exact expected values or write assertion-style statements.
11. The test generator will infer the precise expected behavior from the source code. Your job is to point it in the right direction, not to specify exact assertions.
12. If blacklisted behavior clusters are provided, avoid generating new designs that primarily restate those same clusters unless the uncovered code is now clearly concentrated there.

